<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Trust Fabric · Convergence Hub</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; background: #101418; color: #e8ecef; }
  h1 { font-size: 20px; margin: 8px 0; }
  .card { background: #1a2129; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; margin: 8px 0; }
  input, button { font-size: 16px; padding: 10px; border-radius: 8px; border: 1px solid #3a4653; }
  input { background: #0d1117; color: #fff; flex: 1; min-width: 0; }
  button { background: #2f81f7; color: #fff; border: none; font-weight: 600; flex: 1; }
  button.ghost { background: #30363d; }
  #log { white-space: pre-wrap; font-size: 13px; background: #0d1117; border-radius: 8px; padding: 8px; max-height: 240px; overflow-y: auto; }
  .ok { color: #3fb950; } .bad { color: #f85149; } .mut { color: #d29922; }
  table { width: 100%; font-size: 13px; border-collapse: collapse; }
  td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid #30363d; }
  .hint { font-size: 12px; color: #8b949e; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; }
  .up { background: #12361f; color: #3fb950; } .down { background: #3d1113; color: #f85149; }
</style>
</head>
<body>
<h1>Convergence Hub <span id="bridge" class="pill down">checking…</span></h1>
<div class="card">
  <h3 style="margin:0 0 6px">Bridge — us ↔ CONTINUITY</h3>
  <div id="bridge-body" class="hint">loading…</div>
  <div class="row"><button id="refresh" class="ghost">Refresh</button></div>
</div>
<div class="card">
  <h3 style="margin:0 0 6px">Actor roster (DID → partner user)</h3>
  <div id="actors" class="hint">loading…</div>
</div>
<div class="card">
  <h3 style="margin:0 0 6px">Tracked cases</h3>
  <div class="row">
    <input id="serial" placeholder="serial — e.g. LOT-DEMO-A-000001" autocomplete="off" />
  </div>
  <div class="row">
    <button id="track">Track case</button>
    <button id="dispatch" class="ghost">Dispatch (operator)</button>
  </div>
  <div id="case" class="hint">no case loaded</div>
</div>
<div class="card"><div id="log"></div></div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var log = function (msg, cls) {
    var d = document.createElement("div");
    if (cls) d.className = cls;
    d.textContent = new Date().toISOString().slice(11, 19) + " " + msg;
    $("log").prepend(d);
  };
  var pill = function (up, txt) {
    var b = $("bridge");
    b.className = "pill " + (up ? "up" : "down");
    b.textContent = txt;
  };
  var esc = function (s) { return String(s == null ? "" : s); };
  function refresh() {
    fetch("/converge/health", { credentials: "include" }).then(function (r) { return r.json(); })
      .then(function (h) {
        var up = !!h.partner_up;
        pill(up, up ? "BRIDGE UP" : "BRIDGE DOWN");
        var b = h.bridge || {};
        $("bridge-body").textContent =
          "partner: " + (h.partner_base || "?") + " · map: " + (h.actor_map_source || "?") +
          (b.body && b.body.integrationMode ? " · " + b.body.integrationMode : "") +
          (b.body && b.body.liveChainState ? " · block " + b.body.liveChainState.block : "");
        log("health: partner_up=" + up + " map=" + h.actor_map_source, up ? "ok" : "bad");
      }).catch(function (e) { pill(false, "ERROR"); log("health failed: " + e, "bad"); });
    fetch("/converge/actor-map", { credentials: "include" }).then(function (r) { return r.json(); })
      .then(function (m) {
        var map = m.map || {};
        var rows = Object.keys(map).map(function (did) {
          return "<tr><td>" + esc(did) + "</td><td>" + esc(map[did]) + "</td></tr>";
        }).join("");
        $("actors").innerHTML = "<table><tr><th>DID</th><th>partner user</th></tr>" + rows +
          "</table><p class='hint'>source: " + esc(m.source) + "</p>";
      }).catch(function (e) { $("actors").textContent = "roster failed: " + e; });
  }
  $("refresh").onclick = refresh;
  $("track").onclick = function () {
    var s = $("serial").value.trim();
    if (!s) { log("serial required", "bad"); return; }
    fetch("/converge/status?serial=" + encodeURIComponent(s), { credentials: "include" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var t = d.tracked || {};
        var html = "tracked: case=" + esc(t.case_id) + " handoff=" + esc(t.handoff_id) +
          " incident=" + esc(t.incident_id) +
          "<br>live: " + esc(d.live ? JSON.stringify(d.live).slice(0, 200) : "none") +
          "<br>matches: " + esc((d.matches || []).length);
        $("case").innerHTML = html;
        log("track " + s + ": " + ((d.matches || []).length + " matches"), "ok");
      }).catch(function (e) { log("track failed: " + e, "bad"); });
  };
  $("dispatch").onclick = function () {
    var s = $("serial").value.trim();
    if (!s) { log("serial required", "bad"); return; }
    fetch("/converge/case", {
      method: "POST", credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ serial: s })
    }).then(function (r) {
      return r.json().then(function (j) { return { ok: r.ok, status: r.status, j: j }; });
    }).then(function (r) {
      var j = r.j || {};
      log("dispatch " + r.status + " case=" + esc(j.caseId) + " handoff=" + esc(j.handoffId) +
        " anchor=" + esc((j.partner || {}).anchorTx), r.ok ? "ok" : "bad");
    }).catch(function (e) { log("dispatch failed: " + e, "bad"); });
  };
  refresh();
})();
</script>
</body>
</html>

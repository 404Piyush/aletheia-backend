services:
  besu:
    image: hyperledger/besu:24.12.0
    volumes:
      - ./besu-qbft/genesis.json:/config/genesis.json:ro
      - ./besu-qbft/validator.key:/config/validator.key:ro
      - besu-data:/var/lib/besu
    command: >
      --genesis-file=/config/genesis.json
      --node-private-key-file=/config/validator.key
      --data-path=/var/lib/besu
      --rpc-http-enabled --rpc-http-host=0.0.0.0 --rpc-http-port=8545
      --rpc-http-api=ETH,NET,WEB3 --host-allowlist=*
    ports:
      - "9545:8545"
  backend:
    build: .
    environment:
      DB_PATH: /data/trust.db
      ANCHOR_STORE: /data/anchors.json
      CHAIN_RPC: http://besu:8545
      REDTEAM_MODE: 1
    ports:
      - "8000:8000"
    volumes:
      - tfdata:/data
    depends_on:
      - besu

volumes:
  tfdata: {}
  besu-data: {}

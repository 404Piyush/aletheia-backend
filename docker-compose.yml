services:
  besu:
    image: hyperledger/besu:24.8
    command: >
      --network=dev --miner-enabled
      --miner-coinbase=0xfe3b557e8fb62b89f4916b721be55ceb828dbd73
      --rpc-http-enabled --rpc-http-host=0.0.0.0 --rpc-http-port=8545
      --rpc-http-api=ETH,NET,WEB3 --host-allowlist=* --rpc-http-cors-origins=*
    ports:
      - "8545:8545"
  backend:
    build: .
    environment:
      DB_PATH: /data/trust.db
      ANCHOR_STORE: /data/anchors.json
      CHAIN_RPC: http://besu:8545
      REDTEAM_MODE: 1
    ports:
      - "8000:8000"
    volumes:
      - tfdata:/data
    depends_on:
      - besu

volumes:
  tfdata: {}
